<!DOCTYPE html>

<head>
  <title>Лабораторная работа №2.3</title>
</head>

<body style="background-color: lightblue; font-size: 18px;">
  <h1>Регистрация на сайт</h1>

  <form>
    <p>
      <label>Логин:</label><br>
      <input type="text" size="30">
    </p>

    <p>
      <label>Пароль:</label><br>
      <input type="password" size="30">
    </p>

    <p>
      <label>URL-адрес сайта:</label><br>
      <input type="text" size="30" value="http://">
    </p>

    <p>
      <label>Название сайта:</label><br>
      <input type="text" size="30">
    </p>

    <p>
      <label>Описание сайта:</label><br>
      <textarea rows="8" cols="50"></textarea>
    </p>

    <p>
      <label>Тема сайта:</label><br>
      <select>
        <option>Тема не выбрана</option>
        <option>Новости</option>
        <option>Спорт</option>
        <option>Технологии</option>
        <option>Развлечения</option>
      </select>
    </p>

    <p>
      <label>Баннер 88x31:</label><br>
      <input type="file" size="30">
    </p>

    <p>
      <button type="reset" style="background-color: gray; color: white; font-size: 18px; width: 120px; height: 30px;">Очистить</button>
      <button type="submit" style="background-color: gray; color: white; font-size: 18px; width: 120px; height: 30px;">Отправить</button>
    </p>
  </form>

</body>
</html>
